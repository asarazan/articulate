# ======================================================================================
# Workflow: Respond to Comment (Issues)
# ======================================================================================
# Usage:
# - Comment on a GitHub Issue (not a PR) with "@oz-agent".
# - You can ask questions about the issue, or request a fix (e.g., "@oz-agent can you
#   reproduce this and fix it?").
#
# Setup:
# - Ensure WARP_API_KEY is set in Repository Secrets.
# - Ensure the Action has write permissions for contents, issues, and pull-requests.
#
# Expected Output:
# - The Agent replies to your comment with an answer.
# - If code changes were needed, the Agent opens a new PR (fix/issue-NUMBER) and links
#   it in the reply, since a plain Issue has no branch of its own to push to.
#
# When to use:
# - Use this for interactive triage/Q&A and on-demand fixes from Issue comments.
#
# Note: comments on Pull Requests (and PR review comments) are handled by the
# separate respond-to-comment.yml workflow, which can push directly to the PR branch.
# ======================================================================================
name: Respond to Issue Comment

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.comment.body, '@oz-agent') &&
      !github.event.issue.pull_request &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Acknowledge Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content="eyes"

      - name: Construct Prompt
        id: prompt
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const issue = context.payload.issue;
            const commentBody = context.payload.comment.body;
            const author = context.payload.comment.user.login;

            const prompt = `You are an expert software engineer and the Oz Agent.
            You are responding to an "@oz-agent" mention on GitHub Issue #${issue.number}.

            **Issue Details**:
            - **Title**: ${issue.title}
            - **Description**: ${issue.body || 'No description provided.'}
            - **Comment Request**: "${commentBody}" (from user @${author})

            **Instructions**:
            1. If the user is asking a question, answer it based on your analysis of the codebase. Do not modify any files.
            2. If the user is requesting a code change or fix, implement it, following existing patterns and style.
            3. Do not output the code diff in your final message; only explain what you changed or answer the question.
            4. Format your response in Markdown.
            5. Your output will be posted as a reply to the comment.
            `;

            core.setOutput('prompt', prompt);

      - name: Run Oz Agent
        uses: warpdotdev/oz-agent-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        id: agent
        with:
          prompt: ${{ steps.prompt.outputs.prompt }}
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          profile: ${{ vars.WARP_AGENT_PROFILE || '' }}

      - name: Create PR if Changes Were Made
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes made by Oz Agent."
            exit 0
          fi

          BRANCH_NAME="fix/issue-$ISSUE_NUMBER"

          git config user.name "Oz Agent"
          git config user.email "agent@warp.dev"

          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "Oz Agent: address comment on Issue #$ISSUE_NUMBER"
          git push origin "$BRANCH_NAME" --force

          TITLE="Fix Issue #$ISSUE_NUMBER: ${{ github.event.issue.title }}"
          BODY="This PR was generated in response to an @oz-agent request on Issue #$ISSUE_NUMBER.

          Closes #$ISSUE_NUMBER"

          PR_URL=$(gh pr create --title "$TITLE" --body "$BODY" --base main --head "$BRANCH_NAME")
          echo "Created PR: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Reply to Comment
        if: success()
        uses: actions/github-script@v7
        env:
          AGENT_OUTPUT: ${{ steps.agent.outputs.agent_output }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const raw = process.env.AGENT_OUTPUT || '';

            // Walk JSONL lines and capture the last agent text message, if any.
            let lastText = '';
            for (const line of raw.split('\n')) {
              const trimmed = line.trim();
              if (!trimmed) continue;
              try {
                const obj = JSON.parse(trimmed);
                if (obj.type === 'agent' && typeof obj.text === 'string') {
                  lastText = obj.text;
                }
              } catch (e) {
                // Ignore non-JSON lines
              }
            }

            let content = (lastText || raw || '').trim();
            const prUrl = process.env.PR_URL || '';
            if (prUrl) {
              content += `\n\nI opened a fix here: ${prUrl}`;
            }

            if (!content) {
              core.info('No agent output to reply with.');
              return;
            }

            const body = `@${context.payload.comment.user.login}: ${content}`;
            const { owner, repo } = context.repo;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.payload.issue.number,
              body,
            });

      - name: Report Agent Error
        if: failure() && steps.agent.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = `@${context.payload.comment.user.login}: ⚠️ I encountered an error while processing your request. Please check the [workflow run logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.`;
            const { owner, repo } = context.repo;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.payload.issue.number,
              body,
            });
