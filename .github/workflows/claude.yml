# ======================================================================================
# Workflow: Claude (mention responder)
# ======================================================================================
# Mention "@claude" in an issue, issue/PR comment, or PR review to have Claude
# respond -- answer questions, implement changes on a branch, open PRs. Runs
# anthropics/claude-code-action in interactive mode (no `prompt` input), which
# posts a progress comment on the triggering thread and updates it in place as
# it works -- visible feedback from the first seconds, a hard requirement
# adopted after the predecessor integration's only acknowledgement was an
# emoji reaction followed by minutes of silence.
#
# Environment: mirrors ci.yml's toolchain steps (JDK 17, Android SDK with the
# exact packages plugin-test installs, Gradle) so Claude can run the real
# suite and the real aapt2 oracle (scripts/oracle.sh) in-run -- the
# predecessor's agent ran in a bare sandbox and could only transcribe
# recorded oracle outputs, which is how a silent wrong-output bug shipped
# (see PR #23's audit). ARTICULATE_REQUIRE_ANDROID_SDK=true so a mis-set-up
# runner fails loudly instead of silently skipping the Android tier.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repository secret (subscription billing).
# github_token is deliberately NOT passed: the action then authenticates as
# the Claude GitHub App, whose pushes DO trigger CI -- passing the default
# GITHUB_TOKEN would leave Claude's PRs permanently unchecked (docs:
# "CI not running on Claude's commits").
#
# Setup remaining after merge (human, one-time):
#   claude setup-token            # locally, then add output as repo secret
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN
# ======================================================================================
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

concurrency:
  # One Claude run per thread at a time; a second mention queues rather than
  # racing the first or killing it mid-response.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Bounded: the full plugin suite takes up to ~45m in CI; 60 leaves head-
    # room without permitting the six-hour default hang the predecessor's
    # workflows allowed.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      ARTICULATE_REQUIRE_ANDROID_SDK: "true"
    steps:
      # Full history, not shallow: this repo's commit messages are
      # load-bearing evidence (AGENTS.md "Merges preserve commit messages"),
      # and Claude is expected to consult them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Same packages as ci.yml's plugin-test job -- see its comment for
          # why platforms;android-37.0 (not android-37) is the real id.
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify oracle availability
        # The parity probe (see scripts/oracle.sh). aapt2 must resolve on
        # this runner; xcstringstool correctly cannot (Linux), so only the
        # aapt2 half gates here. A runner where aapt2 is missing must fail
        # before Claude starts, not have Claude discover it mid-task.
        run: scripts/oracle.sh aapt2

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without pre-approved tools, a headless run stalls on Bash approval
          # prompts that nothing can answer. Proven on PR #23's fix run
          # (2026-08-10): the agent completed all three fix items but could
          # not execute a single command -- no test run, no oracle, red-first
          # proofs hand-traced -- and said so. The environment above installs
          # a full toolchain precisely so agents can verify; this line is
          # what actually lets them.
          claude_args: |
            --allowedTools "Bash,Read,Grep,Glob,Edit,Write"
