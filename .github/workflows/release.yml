name: Release

# CI hardening item 6 (PLAN.md, "CI hardening -- SPEC'D 2026-08-06"). This is
# the workflow that actually publishes to the Gradle Plugin Portal --
# distinct from ci.yml's publish-check job, which only proves the artifact
# is *shaped* correctly (publishToMavenLocal + assertions) and deliberately
# never touches the Portal, since it has no credentials to do so.
#
# workflow_dispatch only -- no tag trigger. PLAN.md is explicit that there is
# no tag trigger "for the first release": a push-triggered publish would fire
# on the very first tag pushed for reasons unrelated to wanting to publish
# (e.g. testing the tagging convention itself), and a bad publish to the
# Portal is effectively permanent (published coordinates are immutable, see
# plugin/build.gradle.kts). Manual dispatch, with an explicit confirmation
# input below, is the deliberately higher-friction choice.
#
# Sequencing (PLAN.md): push and watch ci.yml go green BEFORE ever running
# this workflow. This workflow does not depend on ci.yml having run -- GitHub
# Actions has no built-in "only after workflow X is green" gate for
# workflow_dispatch -- so that ordering is a human responsibility, not
# something this file can enforce. It re-runs the full test suite itself
# below as the one automated safeguard it can provide.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you want to publish to the Gradle Plugin Portal and Maven Central (PLAN.md §16). This is irreversible -- published coordinates cannot be unpublished or overwritten.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Fails fast and loudly if the confirmation phrase doesn't match exactly,
  # before any checkout, build, or credential is touched. A typo'd
  # workflow_dispatch input (or a well-meaning "yes"/"true"/"confirm") must
  # not be treated as consent to publish.
  confirm:
    name: Confirm publish intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the literal confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo "::error::Confirmation input was '${{ inputs.confirm }}', not the required literal 'publish'. Re-run this workflow and type exactly: publish"
            exit 1
          fi
          echo "Confirmed."

  # The full suite, unconditionally, immediately before publishing --
  # separate from (and in addition to) whatever state ci.yml left behind,
  # since nothing ties this workflow_dispatch run to a specific green ci.yml
  # run. A red test here must block the publish step below from ever
  # starting.
  test:
    name: Full test suite
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARTICULATE_REQUIRE_ANDROID_SDK: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the full test suite
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: |
            core/build/reports/tests/test
            plugin/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish to the Gradle Plugin Portal
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # First step, before any build work: fail loudly and specifically if
      # either secret is absent, rather than letting publishPlugins fail
      # deep into the task graph with a generic Portal-side error (or,
      # worse, half-publishing one plugin marker before failing on the
      # second). Names the exact secrets a human needs to create.
      - name: Verify publishing credentials are configured
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          MISSING=""
          if [ -z "$GRADLE_PUBLISH_KEY" ]; then
            MISSING="$MISSING GRADLE_PUBLISH_KEY"
          fi
          if [ -z "$GRADLE_PUBLISH_SECRET" ]; then
            MISSING="$MISSING GRADLE_PUBLISH_SECRET"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING. Create them under Settings > Secrets and variables > Actions before running this workflow -- see https://plugins.gradle.org/docs/publish-plugin for how to obtain a Plugin Portal API key/secret pair."
            exit 1
          fi
          echo "Publishing credentials are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to the Gradle Plugin Portal
        run: |
          ./gradlew :plugin:publishPlugins \
            -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} \
            -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }} \
            --stacktrace

  # PLAN.md §16: Maven Central, via nmcp (plugin/build.gradle.kts). D11 stands
  # -- Portal first, Central second -- so this depends on `publish` succeeding,
  # not just on `test`: an irreversible Central deployment must never fire
  # after a Portal publish that failed or never ran. Same typed-`publish`
  # confirmation gate as the Portal job (both are downstream of `confirm`),
  # workflow_dispatch only, no tag or push trigger -- see the top-of-file
  # rationale for why that trigger shape is deliberate.
  publish-central:
    name: Publish to Maven Central
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same reasoning as the Portal job's credential check, extended to
      # Central's four secrets (Portal user token + in-memory signing key):
      # fail before any build work, naming exactly what is missing, rather
      # than letting nmcp fail deep into the task graph -- or worse, upload
      # part of the deployment before failing on a later publication.
      - name: Verify publishing credentials are configured
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          MISSING=""
          if [ -z "$MAVEN_CENTRAL_USERNAME" ]; then
            MISSING="$MISSING MAVEN_CENTRAL_USERNAME"
          fi
          if [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            MISSING="$MISSING MAVEN_CENTRAL_PASSWORD"
          fi
          if [ -z "$SIGNING_IN_MEMORY_KEY" ]; then
            MISSING="$MISSING SIGNING_IN_MEMORY_KEY"
          fi
          if [ -z "$SIGNING_IN_MEMORY_KEY_PASSWORD" ]; then
            MISSING="$MISSING SIGNING_IN_MEMORY_KEY_PASSWORD"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING. Create them under Settings > Secrets and variables > Actions before running this workflow -- see PLAN.md §16.3 for what each one is (a Central Portal user token, and the in-memory-PGP-key pair matching plugin/build.gradle.kts's signingInMemoryKey/signingInMemoryKeyPassword Gradle properties)."
            exit 1
          fi
          echo "Central publishing credentials are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # nmcp's single-project lifecycle task (plugin/build.gradle.kts's
      # `nmcp { publishAllPublicationsToCentralPortal { ... } }`, §16.1).
      # publishingType is USER_MANAGED (set in the build script): this
      # uploads and validates the deployment but does not release it --
      # a human still visits the Central Portal UI to press "Publish" once
      # it looks right, matching this repo's posture on irreversible actions.
      #
      # Credentials passed as ORG_GRADLE_PROJECT_* environment variables
      # (which Gradle maps to project properties of the same suffix), not
      # `-P` command-line flags: SIGNING_IN_MEMORY_KEY is a multi-line
      # ASCII-armored key, and splicing a multi-line secret into a single
      # `run:` shell command line via `-P...=${{ secrets.X }}` breaks the
      # command's syntax. Environment variables don't have that problem.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          ./gradlew :plugin:publishAllPublicationsToCentralPortal --stacktrace
