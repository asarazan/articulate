# KMP + AGP + a composite build together exceed Gradle's default daemon heap:
# a clean first build OOMs and writes a ~370MB heap dump. Raising it here keeps
# the sample's first impression from being a crash.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
android.useAndroidX=true

# AGP 9 enables built-in Kotlin and declares org.jetbrains.kotlin.android
# incompatible. Disabled because :shared is KMP, and KMP requires KGP --
# built-in Kotlin cannot serve it, so mixing the two in one build is a
# fight a test fixture should not be having. Adopting built-in Kotlin is a
# separate decision (PLAN.md D9).
android.builtInKotlin=false

# AGP 9 hides the legacy DSL implementations (android.newDsl defaults true).
# KGP 2.4.10's org.jetbrains.kotlin.android still casts to the old
# com.android.build.gradle.BaseExtension and dies with a ClassCastException.
# This is the Upgrade Assistant's "Preserve the old (internal) AGP DSL APIs"
# step, and it is a genuine requirement here, not a tidiness opt-out.
# TEMPORARY: this escape hatch is removed in AGP 10. Revisit when KGP ships a
# version that works against the new DSL, or when the sample drops
# kotlin.android for AGP's built-in Kotlin.
android.newDsl=false
