[versions]
# Max Gradle fully supported by KGP 2.4.10 is 9.5.0 — wrapper is pinned to match.
kotlin = "2.4.10"
junit = "5.14.4"
# D9 — the supported floor. compileOnly-pinned so `plugin` cannot accidentally
# compile against a newer AGP API a floor consumer wouldn't have at runtime.
agp = "9.1.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
# Gradle 9 requires the launcher on the test runtime classpath explicitly.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# D11: Gradle Plugin Portal first. Also produces the Maven publications, so
# adding Central later needs no restructuring.
plugin-publish = { id = "com.gradle.plugin-publish", version = "1.3.1" }
# §16.1: the Central Portal publisher. Chosen over com.vanniktech.maven.publish
# because plugin-publish already produces correct publications (pluginMaven +
# two markers) -- nmcp uploads *existing* publications to the Central Portal
# API, so the delta is additive and minimal (consistent with §4.5d's razor).
# vanniktech expects to own publication configuration and can conflict with
# plugin-publish's three publications. Verified 1.6.1 is current (2026-08-10).
nmcp = { id = "com.gradleup.nmcp", version = "1.6.1" }
